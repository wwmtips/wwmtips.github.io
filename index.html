<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>연운팁스</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5SMVDZTDST"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-5SMVDZTDST');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="fav/favicon-32x32.png">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#3182f6', bgMain: '#f2f4f6' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f2f4f6; color: #191f28; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .nav-item.active { @apply text-gray-900; }
        .nav-item.active svg { @apply stroke-gray-900 stroke-2; }
        .quiz-row:hover { background-color: #f8fafc; }
        .show { display: block !important; }
    </style>
</head>

<body class="pb-24">
    <script src="calc.js"></script>
    <script src="hw.js"></script>
    <script src="script.js"></script>
    <script src="timer.js"></script>

    <header class="sticky top-0 z-50 bg-white h-[60px] lg:h-[72px] flex items-center px-6 lg:px-8 gap-4 border-b border-gray-100 shadow-sm">
        <div class="font-black text-xl text-blue-600 cursor-pointer" onclick="switchTab('home')">연운팁스</div>


    </header>

    <main id="main-content" class="mx-auto lg:max-w-screen-xl lg:px-6 transition-all duration-300">
        
        <div id="view-home" class="pb-10 lg:pb-20 p-5">
            <div class="max-w-3xl mx-auto">
                
                <div class="mb-8 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-none">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 mb-1">서비스 중단 안내</h3>
                            <p class="text-sm text-gray-600 leading-relaxed">
                                개인 사정으로 인해 더 이상 데이터 업데이트가 진행되지 않습니다.
                                그동안 많은 유저들이 쌓아온 데이터는 <strong>JSON을 통해 자유롭게 활용</strong>하시면 됩니다.<br>도메인 만료 시 자동으로 github으로 이동되며 repo의 자료는 자유롭게 활용하셔도 됩니다.
                            </p>
                            <div class="mt-4 flex gap-2">
                                <button onclick="window.open('https://wwm.tips/json/datas.json')" class="text-xs font-bold text-blue-600 bg-white border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                                    데이터 보기 →
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="quiz-ranking-container" class="mb-6 overflow-x-auto no-scrollbar py-2"></div>

                <div id="quiz-counter-area" class="text-xs text-gray-400 mb-2 text-right">
                    데이터 로딩 중...
                </div>

                <div class="relative mb-6">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="quiz-local-search"
                        class="w-full bg-white border-2 border-blue-100 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block pl-10 p-4 shadow-sm outline-none transition-all placeholder-gray-400 font-bold"
                        placeholder="단서를 입력하세요 (예: 가시, 둥근)">
                </div>

                <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 uppercase bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th scope="col" class="px-2 lg:px-4 py-3 w-[32%]">단서</th>
                                <th scope="col" class="px-2 lg:px-4 py-3 w-[40%]">정답</th>
                                <th scope="col" class="px-2 lg:px-4 py-3 w-[28%] text-right">제보</th>
                            </tr>
                        </thead>
                        <tbody id="quiz-table-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>


    <script>
        // [1] 탭 전환 (무림록, 천지록 관련 로직 제거 및 대응)
        window.switchTab = function (tabName, updateHistory = true) {
            const urlMapping = { 'home': '', 'quiz': '', 'todo': 'hw' };
            const targetParam = urlMapping[tabName] || tabName;
            
            const views = ['view-home', 'view-todo'];
            views.forEach(v => {
                const el = document.getElementById(v);
                if (!el) return;
                const isTarget = (v === 'view-' + tabName) || 
                               (tabName === 'quiz' && v === 'view-home') ||
                               (tabName === 'todo' && v === 'view-todo');
                el.style.display = isTarget ? 'block' : 'none';
            });

            updateNavUI(tabName === 'quiz' ? 'home' : tabName);

            if (updateHistory) {
                let newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                if (targetParam && targetParam !== 'home') newUrl += '?tab=' + targetParam;
                window.history.pushState({ tab: tabName }, '', newUrl);
            }
            window.scrollTo(0, 0);
            if (tabName === 'todo') updateTimers();
        };

        function updateNavUI(activeTab) {
            ['pc-nav-home', 'pc-nav-todo'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const isMatch = id === 'pc-nav-' + activeTab;
                el.classList.toggle('text-blue-600', isMatch);
                el.classList.toggle('active', isMatch);
                el.classList.toggle('text-gray-500', !isMatch);
            });
            ['nav-home', 'nav-todo'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const isMatch = id === 'nav-' + activeTab;
                el.classList.toggle('active', isMatch);
                el.classList.toggle('text-gray-400', !isMatch);
            });
        }

        // 기존 타이머 및 공통 로직 유지
        window.updateTimers = function () {
            if (typeof TIMERS === 'undefined') return;
            const now = new Date();
            const serverTimeEl = document.getElementById('server-time');
            if (serverTimeEl) serverTimeEl.innerText = now.toTimeString().split(' ')[0];
        };

        setInterval(updateTimers, 1000);
        window.addEventListener('DOMContentLoaded', () => { updateTimers(); });
    </script>
</body>
</html>
