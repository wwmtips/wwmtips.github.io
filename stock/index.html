<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리얼타임 MCN 오피스 (스트리머 키우기)</title>
    <style>
        /* ==========================================================================
           치지직(CHZZK) 스타일 디자인 시스템 & 글로벌 CSS
           ========================================================================== */
        :root {
          --bg-main: #0c0d0f;         /* 치지직 특유의 어두운 차콜 그레이 */
          --bg-card: #181a1e;         /* 컴포넌트 및 카드 배경색 */
          --bg-panel: #1f2228;        /* 인풋 및 2차 배경색 */
          --point-green: #00ffa3;     /* 치지직 시그니처 네온 그린 */
          --point-blue: #00bcff;      /* 치지직 그라디언트 서브 블루 */
          --point-pink: #ff3a76;      /* 경고 및 연장방송 포인트 핑크 */
          --text-primary: #ffffff;    /* 주 텍스트 */
          --text-secondary: #929aa5;  /* 부 텍스트 */
          --bg-tag: #25282e;          /* 알약형 태그 배경색 */
          --border-color: #262930;    /* 세련된 경계선 색상 */
          --border-radius: 12px;      /* 트렌디한 라운드 값 */
        }

        body {
            background-color: #050507; 
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #mobile-container {
            width: 100%; max-width: 420px; height: 100%;
            display: flex; flex-direction: column;
            background-color: var(--bg-main); position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
        }

        /* 최상단 메뉴 바 */
        #top-bar {
            background-color: var(--bg-main); padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); font-size: 13px;
        }
        #clock-display { font-weight: 700; color: var(--text-primary); display: flex; flex-direction: column; gap: 2px; }
        .date-text { font-size: 11px; color: var(--text-secondary); font-weight: 400; }
        
        .top-btn-group { display: flex; gap: 8px; }
        .top-btn {
            background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); 
            padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px;
            transition: all 0.2s ease;
        }
        .top-btn:hover { background-color: var(--bg-panel); border-color: var(--text-secondary); }
        
        #overtime-btn { color: var(--point-pink); border-color: rgba(255, 58, 118, 0.3); background-color: rgba(255, 58, 118, 0.05);}
        #overtime-btn.on { background-color: var(--point-pink); color: #fff; border-color: var(--point-pink); box-shadow: 0 0 10px rgba(255, 58, 118, 0.4); }

        /* 자산 현황 판넬 */
        #header-panel {
            padding: 20px 16px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .asset-info { text-align: left; }
        .asset-title { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .asset-total { font-size: 24px; font-weight: 800; margin: 4px 0; color: var(--text-primary); }
        .roi { font-size: 13px; font-weight: 600; }
        .roi.up { color: var(--point-green); } 
        .roi.down { color: var(--point-pink); }

        /* 방송 상태 배너 */
        #market-banner {
            background-color: #131518; color: var(--text-secondary);
            text-align: center; padding: 8px; font-weight: 700; font-size: 12px;
            border-bottom: 1px solid var(--border-color); letter-spacing: -0.3px;
        }
        #market-banner.open { background-color: rgba(0, 255, 163, 0.08); color: var(--point-green); border-bottom: 1px solid rgba(0, 255, 163, 0.2); }

        /* 트렌드 전광판 티커 */
        #ticker-container {
            width: 100%; overflow-x: auto; background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color); scrollbar-width: none; 
        }
        #ticker-container::-webkit-scrollbar { display: none; }
        #ticker-panel {
            display: flex; gap: 24px; padding: 12px 16px; width: max-content;
        }
        .stock-item { display: flex; flex-direction: column; align-items: flex-start; min-width: 85px; }
        .stock-name { font-weight: 600; color: var(--text-secondary); font-size: 11px; margin-bottom: 3px;}
        .stock-price { font-weight: 700; color: var(--text-primary); font-size: 13px; transition: color 0.3s;}
        .trend-up { color: var(--point-green); font-size: 10px; font-weight: 600; margin-top: 2px; }
        .trend-down { color: var(--point-pink); font-size: 10px; font-weight: 600; margin-top: 2px; }

        /* 인게임 스튜디오 스크린(Canvas) */
        #canvas-container {
            flex: none; display: flex; justify-content: center;
            background-color: #050507; padding: 0; border-bottom: 1px solid var(--border-color); position: relative;
        }
        #game-canvas { background-color: #0c0d0f; cursor: pointer; }
        
        /* 좌석 확장 버튼 */
        .expand-btn {
            position: absolute; top: 12px; right: 12px; background-color: var(--bg-panel); color: var(--point-green);
            border: 1px solid rgba(0, 255, 163, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer;
            backdrop-filter: blur(4px); transition: all 0.2s ease;
        }
        .expand-btn:hover { background-color: var(--point-green); color: #000; }

        /* 실시간 방송/수금 로그 패널 */
        #log-panel {
            flex: 1; padding: 12px; background-color: var(--bg-main);
            overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
        }
        .log-item {
            font-size: 12px; color: var(--text-primary); background-color: var(--bg-card);
            padding: 10px 12px; border-radius: 8px; border-left: 3px solid var(--border-color); word-break: keep-all; line-height: 1.4;
            display: flex; gap: 10px; align-items: center;
        }
        .log-time { color: var(--text-secondary); font-size: 11px; min-width: 50px; font-family: monospace; }
        .log-content { flex: 1; font-weight: 500; }
        
        /* 치지직 테마에 맞춘 로그 아이템 강조 보더 */
        .log-item.superchat { border-left-color: var(--point-green); background-color: rgba(0, 255, 163, 0.02); }
        .log-item.superchat .log-content { color: var(--point-green); }
        .log-item.superchat .log-msg { color: var(--text-primary); font-weight: 400; margin-left: 4px; }
        .log-item.event { border-left-color: var(--point-blue); }
        .log-item.event .log-content { color: var(--point-blue); }
        .log-item.hr { border-left-color: #ffb000; }
        .log-item.hr .log-content { color: #ffb000; }
        .log-item.upgrade { border-left-color: #a855f7; }
        .log-item.upgrade .log-content { color: #c084fc; font-weight: 700; }

        /* 모달 시스템 공통 (치지직 오버레이 팝업 스타일) */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 5, 7, 0.85); z-index: 100; backdrop-filter: blur(4px);
            flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: var(--bg-card); width: 92%; border-radius: var(--border-radius); border: 1px solid var(--border-color);
            padding: 20px; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.6); color: var(--text-primary);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-title { 
            font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); 
            border-bottom: 1px solid var(--border-color); padding-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { 
            width: 100%; padding: 12px; margin-top: 12px; background-color: var(--bg-panel); color: var(--text-primary); 
            border: 1px solid var(--border-color); border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .close-btn:hover { background-color: var(--bg-tag); border-color: var(--text-secondary); }

        /* 스트리머 인포 프로필 & 스탯 그리드 */
        .profile-container { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
        
        /* 모달 내부 초상화 치지직 링 장식 */
        .portrait-box {
            width: 64px; height: 64px; background-color: var(--bg-main); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
            box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--point-green); overflow: hidden;
        }
        .stat-details { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .stat-row { display: flex; flex-direction: column; font-size: 11px; color: var(--text-secondary); background: var(--bg-panel); padding: 6px 8px; border-radius: 6px; }
        .stat-val { font-weight: 700; color: var(--text-primary); margin-top: 3px; font-size: 12px; }

        /* 방송 카테고리 설정 셀렉터 */
        .category-selector { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
        .category-selector label { color: var(--text-secondary); font-weight: 700; }
        .category-selector select { 
            width: 100%; padding: 10px; background-color: var(--bg-panel); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; outline: none;
        }

        /* 케어/업그레이드 기능형 버튼 구조 */
        .upgrade-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
        .upgrade-btn {
            background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary);
            padding: 10px 4px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; transition: 0.2s;
        }
        .upgrade-btn span.cost { color: var(--point-green); font-weight: 700; margin-top: 4px; font-size: 10px; }
        .upgrade-btn:hover { background-color: var(--bg-tag); border-color: var(--text-secondary); }

        /* 슈퍼챗 대화창 내역 로그 박스 */
        .message-box {
            background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px;
            height: 90px; overflow-y: auto; padding: 10px; font-size: 12px; margin-bottom: 16px;
        }
        .msg-item { border-bottom: 1px solid var(--bg-card); padding-bottom: 6px; margin-bottom: 6px; line-height: 1.4;}
        .msg-amt { color: var(--point-green); font-weight: 700; margin-right: 6px; }
        .msg-text { color: var(--text-primary); }

        /* 정산 분배 비율 슬라이더 대용 버튼 스위치 */
        .split-btn-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .split-btn { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-secondary); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; }
        .split-btn.active { background: rgba(0, 255, 163, 0.15); color: var(--point-green); border-color: var(--point-green); font-weight: 700; }

        /* 채용 시스템(HR) 후보 카드 팝업 */
        .candidate-card {
            background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px;
            padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .candidate-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px;}
        .candidate-stats { font-size: 12px; color: var(--text-secondary); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .hire-btn {
            background-color: var(--point-green); color: #000; border: none; padding: 10px; border-radius: 6px;
            font-weight: 700; cursor: pointer; margin-top: 4px; text-align: center; font-size: 13px;
        }
        .hire-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <div id="mobile-container">
        <div id="top-bar">
            <div id="clock-display">
                <span id="real-time-clock">00:00:00</span>
                <span id="real-date-text" class="date-text">2026. 6. 10</span>
            </div>
            <div class="top-btn-group">
                <button id="overtime-btn" class="top-btn" onclick="toggleOvertime()">🌙 연장 방송</button>
                <button class="top-btn" onclick="openHrModal()" style="background-color: var(--point-green); border-color: var(--point-green); color:#000;">스트리머 영입</button>
            </div>
        </div>

        <div id="market-banner">💤 정규 방송 시간 종료 (소속 스트리머 휴식 중)</div>

        <div id="header-panel">
            <div class="asset-info">
                <div class="asset-title">MCN 법인 자금</div>
                <div class="asset-total" id="cash-display">10,000,000원</div>
                <div class="roi" id="roi-display">누적 소속사 수익: 0원</div>
            </div>
        </div>

        <div id="ticker-container">
            <div id="ticker-panel"></div>
        </div>

        <div id="canvas-container">
            <button class="expand-btn" id="expand-btn-text" onclick="expandStudio()">🏢 좌석 확장 (500만)</button>
            <canvas id="game-canvas" width="340" height="340"></canvas>
        </div>

        <div id="log-panel"></div>

        <div id="hr-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title">
                    <span>스트리머 영입 공고</span>
                    <span style="font-size:12px; color:var(--point-green); cursor:pointer; font-weight:700;" onclick="rerollCandidates()">🔄 후보 갱신 (50만)</span>
                </div>
                <div id="candidate-list"></div>
                <button class="close-btn" onclick="closeHrModal()">닫기</button>
            </div>
        </div>

        <div id="streamer-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title" id="streamer-modal-name">이름 (티어)</div>
                
                <div class="profile-container">
                    <div class="portrait-box" id="streamer-modal-photo">📸</div>
                    <div class="stat-details">
                        <div class="stat-row"><span>팔로워 수</span><span class="stat-val" id="streamer-modal-followers" style="color: var(--point-green);">0명</span></div>
                        <div class="stat-row"><span>누적 수익</span><span class="stat-val" id="streamer-modal-profit" style="color: #ffffff;">0원</span></div>
                        <div class="stat-row"><span>기본 수금력</span><span class="stat-val" id="streamer-modal-power">0</span></div>
                        <div class="stat-row"><span>멘탈 소모/틱</span><span class="stat-val" id="streamer-modal-drain">0</span></div>
                        <div class="stat-row"><span>쿨타임(초)</span><span class="stat-val" id="streamer-modal-cooldown">0</span></div>
                    </div>
                </div>

                <div class="category-selector">
                    <label>현재 방송 카테고리 설정</label>
                    <select id="category-select" onchange="changeCategory(this.value)"></select>
                </div>

                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight:700;">능력치 및 인프라 지원</div>
                <div class="upgrade-grid">
                    <button class="upgrade-btn" onclick="buyUpgrade('makeup')">
                        💄 뷰티/장비 (<span id="lv-makeup">0</span>)
                        <span style="font-size:8px; color:var(--text-secondary); margin-top:2px;">수금력 증가</span>
                        <span class="cost">100만원</span>
                    </button>
                    <button class="upgrade-btn" onclick="buyUpgrade('pc')">
                        💻 방송용 PC (<span id="lv-pc">0</span>)
                        <span style="font-size:8px; color:var(--text-secondary); margin-top:2px;">쿨타임 감소</span>
                        <span class="cost">200만원</span>
                    </button>
                    <button class="upgrade-btn" onclick="buyUpgrade('speech')">
                        🎤 스피치 학원 (<span id="lv-speech">0</span>)
                        <span style="font-size:8px; color:var(--text-secondary); margin-top:2px;">멘탈 방어력</span>
                        <span class="cost">150만원</span>
                    </button>
                </div>

                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight:700;">💬 최근 도네이션 및 슈퍼챗 내역</div>
                <div class="message-box" id="streamer-message-list"></div>
                
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight:700;">수익 분배 계약 조건 (회사 : 스트리머)</div>
                <div class="split-btn-group">
                    <button class="split-btn" id="split-73" onclick="setSplit(0.7)">7 : 3<br><span style="font-size:9px;color:var(--point-pink);font-weight:700;">(멘탈 폭락)</span></button>
                    <button class="split-btn" id="split-55" onclick="setSplit(0.5)">5 : 5<br><span style="font-size:9px;color:var(--text-secondary)">(표준 계약)</span></button>
                    <button class="split-btn" id="split-37" onclick="setSplit(0.3)">3 : 7<br><span style="font-size:9px;color:var(--point-green);font-weight:700;">(멘탈 회복)</span></button>
                </div>

                <div style="display:flex; gap:10px; margin-top:14px;">
                    <button class="close-btn" style="background-color: rgba(255, 58, 118, 0.1); border-color: var(--point-pink); color: var(--point-pink); margin-top:0; flex:1;" onclick="fireSelectedStreamer()">✂️ 계약 해지</button>
                    <button class="close-btn" style="background-color: var(--bg-panel); margin-top:0; flex:2;" onclick="closeStreamerModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const logPanel = document.getElementById('log-panel');

        let isPaused = false;
        let forceOvertime = false; 

        let platforms = {
            'JustChatting': { name: '저스트채팅', viewers: 45000, trend: 0 },
            'LoL': { name: '리그오브레전드', viewers: 82000, trend: 0 },
            'Valorant': { name: '발로란트', viewers: 31000, trend: 0 },
            'Minecraft': { name: '마인크래프트', viewers: 55000, trend: 0 },
            'Vtuber': { name: '버추얼', viewers: 60000, trend: 0 },
            'Mukbang': { name: '먹방/쿡방', viewers: 12000, trend: 0 }
        };

        let company = { initialCash: 10000000, cash: 10000000, totalProfit: 0 };

        let world = {
            desks: [
                {x:80,y:60, active:true, occupant:null}, {x:170,y:60, active:true, occupant:null}, {x:260,y:60, active:true, occupant:null},
                {x:80,y:140, active:false, occupant:null}, {x:170,y:140, active:false, occupant:null}, {x:260,y:140, active:false, occupant:null}
            ],
            restAreas: [
                {x:100,y:260, active:true, occupant:null}, {x:170,y:260, active:true, occupant:null}, {x:240,y:260, active:false, occupant:null}
            ],
            streamers: [], idCounter: 1
        };

        /* 치지직 브랜드 정체성에 맞춘 티어 색상 변경 */
        const TIERS = {
            'Rookie': { roleName: '🌱하꼬방', color: '#929aa5', speed: 1.0, streamCooldown: 8, baseDrain: 0.15, superchatPower: 5000 },
            'Pro':    { roleName: '🌟중견방', color: '#00bcff', speed: 1.2, streamCooldown: 5, baseDrain: 0.1, superchatPower: 30000 },
            'Star':   { roleName: '👑대기업', color: '#00ffa3', speed: 0.8, streamCooldown: 3, baseDrain: 0.05, superchatPower: 150000 }
        };

        class Streamer {
            constructor(id, config) {
                this.id = id; this.tierType = config.tierType; this.roleName = config.roleName; 
                this.color = config.color; this.speed = config.speed;
                this.baseCooldown = config.streamCooldown; this.baseDrain = config.baseDrain;
                this.superchatPower = config.superchatPower; this.name = config.name; this.photo = config.photo;
                
                this.x = 170; this.y = 350; this.targetX = this.x; this.targetY = this.y;
                
                this.mental = 100; this.state = 'off_work'; 
                this.lastStreamTime = Date.now();
                this.targetNode = null;
                
                this.totalEarnedForCompany = 0;
                this.companySplit = 0.5;
                this.currentCategory = 'JustChatting';
                
                this.makeupLevel = 0; 
                this.pcLevel = 0;     
                this.speechLevel = 0; 
                
                this.messages = [];

                if (config.followers !== undefined) {
                    this.followers = config.followers;
                } else {
                    if (this.tierType === 'Rookie') this.followers = Math.floor(Math.random() * 10000);
                    else if (this.tierType === 'Pro') this.followers = 200000 + Math.floor(Math.random() * 100000);
                    else this.followers = 1000000 + Math.floor(Math.random() * 200000);
                }
            }

            getCooldown() {
                return Math.max(1, this.baseCooldown - (this.pcLevel * 0.5));
            }

            getMentalDrain() {
                let drainMultiplier = 1.0;
                if(this.companySplit === 0.7) drainMultiplier = 1.5;
                else if(this.companySplit === 0.3) drainMultiplier = 0.6;
                
                let drain = (this.baseDrain * drainMultiplier) - (this.speechLevel * 0.02);
                return Math.max(0.01, drain);
            }

            releaseNode() {
                if(this.targetNode) { this.targetNode.occupant = null; this.targetNode = null; }
            }

            checkPromotion() {
                if (this.tierType === 'Rookie' && this.followers >= 200000) {
                    this.tierType = 'Pro';
                    this.roleName = TIERS['Pro'].roleName;
                    this.color = TIERS['Pro'].color;
                    this.baseCooldown = TIERS['Pro'].streamCooldown;
                    this.baseDrain = TIERS['Pro'].baseDrain;
                    this.superchatPower = TIERS['Pro'].superchatPower;
                    addLog(`🎉 [자동 승진] ${this.name} 스트리머가 팔로워 20만 명을 돌파하여 [${this.roleName}]으로 승진했습니다!`, 'upgrade');
                    if (selectedStreamer && selectedStreamer.id === this.id) openStreamerModal(this);
                } else if (this.tierType === 'Pro' && this.followers >= 1000000) {
                    this.tierType = 'Star';
                    this.roleName = TIERS['Star'].roleName;
                    this.color = TIERS['Star'].color;
                    this.baseCooldown = TIERS['Star'].streamCooldown;
                    this.baseDrain = TIERS['Star'].baseDrain;
                    this.superchatPower = TIERS['Star'].superchatPower;
                    addLog(`👑 [💥대기업 등극] ${this.name} 스트리머가 팔로워 100만 명을 달성하여 [${this.roleName}]이 되었습니다!`, 'upgrade');
                    if (selectedStreamer && selectedStreamer.id === this.id) openStreamerModal(this);
                }
            }

            update(isBroadcastTime) {
                if (!isBroadcastTime && this.state !== 'off_work' && this.state !== 'going_home') {
                    this.releaseNode();
                    this.state = 'going_home'; this.targetX = 170; this.targetY = 350; 
                } else if (isBroadcastTime && this.state === 'off_work') {
                    this.state = 'arriving'; this.x = 170; this.y = 350; this.targetX = 170; this.targetY = 260; 
                }

                if (this.state === 'going_home' || this.state === 'arriving' || this.state === 'moving') {
                    let dx = this.targetX - this.x; let dy = this.targetY - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > this.speed) { 
                        this.x += (dx / dist) * this.speed; this.y += (dy / dist) * this.speed; 
                    } else { 
                        this.x = this.targetX; this.y = this.targetY;
                        if (this.state === 'going_home') this.state = 'off_work';
                        else if (this.state === 'arriving') this.state = 'idle';
                        else this.state = this.nextState; 
                    }
                    return; 
                }

                if (this.state === 'off_work') return; 

                let now = Date.now();
                switch (this.state) {
                    case 'idle':
                        if (this.mental < 30) {
                            let rest = world.restAreas.find(r => r.active && r.occupant === null);
                            if (rest) {
                                rest.occupant = this; this.targetNode = rest;
                                this.targetX = rest.x; this.targetY = rest.y;
                                this.state = 'moving'; this.nextState = 'resting_continuous';
                            }
                        } else {
                            let desk = world.desks.find(d => d.active && d.occupant === null);
                            if (desk) {
                                desk.occupant = this; this.targetNode = desk;
                                this.targetX = desk.x; this.targetY = desk.y;
                                this.state = 'moving'; this.nextState = 'streaming_continuous';
                            }
                        }
                        break;
                        
                    case 'streaming_continuous':
                        this.mental -= this.getMentalDrain();
                        if (now - this.lastStreamTime > this.getCooldown() * 1000) {
                            receiveSuperchat(this); 
                            this.lastStreamTime = now;
                        }
                        if (this.mental <= 0) {
                            this.releaseNode();
                            this.mental = 0; this.state = 'idle'; 
                        }
                        break;
                        
                    case 'resting_continuous':
                        this.mental += 2.0; 
                        if (this.mental >= 100) { 
                            this.releaseNode();
                            this.mental = 100; this.state = 'idle'; 
                        }
                        break;
                }
            }

            /* 🎨 인게임 캐릭터 및 치지직 그라디언트 초상화 보더 디자인 수정 */
            draw() {
                if (this.state === 'off_work') return; 

                // 그림자 효과
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.arc(this.x, this.y + 12, 11, 0, Math.PI * 2); ctx.fill();
                
                // 몸체 그리기 (세련된 스퀘어 디자인)
                ctx.fillStyle = this.color; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(this.x - 8, this.y - 4, 16, 16, 5) : ctx.fillRect(this.x - 8, this.y - 4, 16, 16); ctx.fill();
                
                // 치지직 특유의 링 장식 (방송 상태에 따른 실시간 그라디언트 테두리화)
                if (this.state === 'streaming_continuous') {
                    let grad = ctx.createLinearGradient(this.x - 9, this.y - 19, this.x + 9, this.y - 1);
                    grad.addColorStop(0, '#00ffa3'); // 네온 그린
                    grad.addColorStop(1, '#00bcff'); // 서브 블루
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(this.x, this.y - 10, 9, 0, Math.PI * 2); ctx.fill();
                } else if (this.state === 'resting_continuous') {
                    ctx.fillStyle = '#1f2228'; // 휴식 중 회색 보더
                    ctx.beginPath(); ctx.arc(this.x, this.y - 10, 9, 0, Math.PI * 2); ctx.fill();
                }

                // 캐릭터 내부 얼굴 (링 두께 공백 확보 후 채우기)
                let faceColor = this.makeupLevel > 0 ? '#ffccd5' : '#fbe5d6';
                ctx.fillStyle = this.state !== 'idle' ? '#181a1e' : '#0c0d0f'; // 외곽 구분 투명 대체용 선처리
                ctx.beginPath(); ctx.arc(this.x, this.y - 10, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = faceColor;
                ctx.beginPath(); ctx.arc(this.x, this.y - 10, 6.5, 0, Math.PI * 2); ctx.fill();

                // 하단 메타 데이터 네임택 디자인 개편
                let boxW = 58; let boxH = 28; let boxX = this.x - boxW/2; let boxY = this.y + 16;
                ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
                ctx.fillStyle = '#181a1e'; ctx.strokeStyle = '#262930'; ctx.lineWidth = 1; ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 6); else ctx.fillRect(boxX, boxY, boxW, boxH);
                ctx.fill(); ctx.stroke(); ctx.restore();

                ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif';
                ctx.fillText(this.name, this.x, boxY + 11);
                
                let stateText = '대기중'; let stateColor = '#929aa5';
                if(this.state === 'streaming_continuous') { stateText = '🔴 ON AIR'; stateColor = '#ff3a76'; }
                else if(this.state === 'resting_continuous') { stateText = '💤 휴식중'; stateColor = '#00ffa3'; }
                else if(this.state === 'going_home') { stateText = '🏃 퇴근중'; stateColor = '#929aa5'; }
                
                ctx.fillStyle = stateColor; ctx.font = '700 9px sans-serif'; ctx.fillText(stateText, this.x, boxY + 22);
            }
        }

        // ================= 스튜디오 오피스 인프라 제어 =================
        function expandStudio() {
            let inactiveDesk = world.desks.find(d => !d.active);
            if(!inactiveDesk) {
                alert("이미 스튜디오를 최대(6석)로 확장했습니다!"); return;
            }
            if(company.cash < 5000000) {
                alert("법인 자금이 부족합니다. (확장 비용: 500만원)"); return;
            }
            company.cash -= 5000000;
            inactiveDesk.active = true;
            
            let inactiveRest = world.restAreas.find(r => !r.active);
            if(inactiveRest) inactiveRest.active = true;

            addLog("🏢 [스튜디오 확장] 새로운 좌석 배치가 완료되었습니다!", "event");
            updateUI();
            saveGameData(); 
        }

        // ================= HR 채용 시스템 =================
        let currentCandidates = [];
        function generateCandidates() {
            currentCandidates = [];
            let shuffled = STREAMER_POOL.slice().sort(() => 0.5 - Math.random());
            let picked = shuffled.slice(0, 3);

            for(let i=0; i<3; i++) {
                let data = picked[i]; let base = TIERS[data.tierType];
                let powerVariation = 0.8 + (Math.random() * 0.4); 
                let drainVariation = 0.8 + (Math.random() * 0.4); 
                let cost = data.tierType === 'Star' ? 8000000 : (data.tierType === 'Pro' ? 3000000 : 500000);
                
                currentCandidates.push({
                    tierType: data.tierType, roleName: base.roleName, color: base.color, speed: base.speed,
                    streamCooldown: base.streamCooldown, baseDrain: base.baseDrain * drainVariation,
                    superchatPower: Math.floor(base.superchatPower * powerVariation),
                    name: data.name, photo: data.photo, hireFee: cost
                });
            }
            renderCandidates();
        }
        function renderCandidates() {
            let container = document.getElementById('candidate-list');
            container.innerHTML = '';
            if(currentCandidates.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color:var(--text-secondary);">대기 중인 후보가 없습니다. 새로고침을 눌러주세요.</div>`; return;
            }
            currentCandidates.forEach((cand, index) => {
                let card = document.createElement('div'); card.className = 'candidate-card';
                card.innerHTML = `
                    <div class="candidate-header"><span style="color:${cand.color}">${cand.roleName} ${cand.name}</span><span>계약금: ${cand.hireFee.toLocaleString()}원</span></div>
                    <div class="candidate-stats"><div>💸 수금력: ${cand.superchatPower.toLocaleString()}</div><div>📉 멘탈소모: ${(cand.baseDrain * 100).toFixed(1)}/틱</div></div>
                    <button class="hire-btn" onclick="hireCandidate(${index})">영입하기</button>
                `;
                container.appendChild(card);
            });
        }
        function rerollCandidates() {
            if(company.cash < 500000) { alert("자금이 부족합니다. (50만원 필요)"); return; }
            company.cash -= 500000; addLog("🔄 영입 후보 목록을 갱신했습니다.", "hr");
            generateCandidates(); updateUI();
        }
        function hireCandidate(index) {
            let activeDesks = world.desks.filter(d => d.active).length;
            if (world.streamers.length >= activeDesks) { alert(`활성화된 스튜디오 좌석(${activeDesks}석)이 꽉 찼습니다! 확장하거나 기존 직원을 방출하세요.`); return; }
            let cand = currentCandidates[index];
            if (company.cash < cand.hireFee) { alert("자금이 부족합니다!"); return; }
            
            company.cash -= cand.hireFee;
            let newStreamer = new Streamer(world.idCounter++, cand);
            world.streamers.push(newStreamer);
            currentCandidates.splice(index, 1); 
            addLog(`[영입] ${newStreamer.name} (${newStreamer.roleName}) 스트리머 영입 완료!`, 'hr');
            renderCandidates(); updateUI();
            saveGameData();
        }
        function openHrModal() { 
            isPaused = true; 
            if(currentCandidates.length === 0) generateCandidates(); else renderCandidates();
            document.getElementById('hr-modal').style.display = 'flex'; 
        }
        function closeHrModal() { isPaused = false; document.getElementById('hr-modal').style.display = 'none'; }
        
        // ================= 오피스 인터랙션 모달 제어 =================
        let selectedStreamer = null;
        canvas.addEventListener('click', function(e) {
            if (isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            let clicked = null;
            for (let i = 0; i < world.streamers.length; i++) {
                let s = world.streamers[i];
                if(s.state === 'off_work') continue; 
                if (Math.sqrt(Math.pow(clickX - s.x, 2) + Math.pow(clickY - s.y, 2)) < 25) { clicked = s; break; }
            }
            if (clicked) openStreamerModal(clicked);
        });

        function initCategoryOptions() {
            let select = document.getElementById('category-select');
            select.innerHTML = '';
            for(let key in platforms) {
                select.innerHTML += `<option value="${key}">${platforms[key].name}</option>`;
            }
        }

        function openStreamerModal(streamer) {
            isPaused = true; selectedStreamer = streamer;
            document.getElementById('streamer-modal-name').innerHTML = `<span style="color:${streamer.color}">${streamer.roleName}</span> ${streamer.name}`;
            
            document.getElementById('streamer-modal-followers').innerText = `${streamer.followers.toLocaleString()}명`;
            document.getElementById('streamer-modal-profit').innerText = `${Math.floor(streamer.totalEarnedForCompany).toLocaleString()}원`;
            document.getElementById('streamer-modal-power').innerText = streamer.superchatPower.toLocaleString();
            document.getElementById('streamer-modal-drain').innerText = (streamer.getMentalDrain() * 100).toFixed(1);
            document.getElementById('streamer-modal-cooldown').innerText = streamer.getCooldown().toFixed(1);
            
            document.getElementById('lv-makeup').innerText = streamer.makeupLevel;
            document.getElementById('lv-pc').innerText = streamer.pcLevel;
            document.getElementById('lv-speech').innerText = streamer.speechLevel;

            document.getElementById('category-select').value = streamer.currentCategory;
            
            let photoBox = document.getElementById('streamer-modal-photo');
            if(streamer.photo && streamer.photo !== "") photoBox.innerHTML = `<img src="${streamer.photo}" style="width:100%; height:100%; object-fit:cover;">`;
            else photoBox.innerHTML = `📸`;

            let msgContainer = document.getElementById('streamer-message-list');
            msgContainer.innerHTML = '';
            if(streamer.messages.length === 0) msgContainer.innerHTML = `<div style="color:var(--text-secondary);text-align:center;margin-top:20px;">아직 받은 후원이 없습니다.</div>`;
            else streamer.messages.forEach(m => {
                let div = document.createElement('div'); div.className = 'msg-item';
                div.innerHTML = `<span class="msg-amt">₩${m.amount.toLocaleString()}</span><span class="msg-text">${m.text}</span>`;
                msgContainer.appendChild(div);
            });

            updateSplitButtons(streamer.companySplit);
            document.getElementById('streamer-modal').style.display = 'flex';
        }
        function closeStreamerModal() { document.getElementById('streamer-modal').style.display = 'none'; selectedStreamer = null; isPaused = false; }
        
        function changeCategory(val) {
            if(selectedStreamer) {
                selectedStreamer.currentCategory = val;
                addLog(`📺 [카테고리 변경] ${selectedStreamer.name} 방 제목: [${platforms[val].name}]`, 'event');
            }
        }

        function buyUpgrade(type) {
            if(!selectedStreamer) return;
            let cost = 0; let msg = ''; let logClass = 'upgrade';
            if(type === 'makeup') { cost = 1000000; msg = `💄 뷰티 세팅 완료! 수금력 상승!`; }
            if(type === 'pc') { cost = 2000000; msg = `💻 최고급 PC 지원! 방송 쿨타임 감소!`; }
            if(type === 'speech') { cost = 1500000; msg = `🎤 스피치 학원 수료! 멘탈 소모 감소!`; }

            if(company.cash < cost) { alert("자금이 부족합니다!"); return; }
            company.cash -= cost;

            if(type === 'makeup') selectedStreamer.makeupLevel++;
            if(type === 'pc') selectedStreamer.pcLevel++;
            if(type === 'speech') selectedStreamer.speechLevel++;

            addLog(`[능력치 UP] ${selectedStreamer.name}: ${msg}`, logClass);
            updateUI();
            openStreamerModal(selectedStreamer);
        }

        function updateSplitButtons(ratio) {
            ['split-73','split-55','split-37'].forEach(id => document.getElementById(id).className = 'split-btn');
            if(ratio === 0.7) document.getElementById('split-73').classList.add('active');
            else if(ratio === 0.3) document.getElementById('split-37').classList.add('active');
            else document.getElementById('split-55').classList.add('active');
        }
        function setSplit(ratio) {
            if(selectedStreamer) {
                selectedStreamer.companySplit = ratio;
                updateSplitButtons(ratio);
                let text = ratio === 0.7 ? "7:3 (회사 7)" : (ratio === 0.3 ? "3:7 (회사 3)" : "5:5");
                addLog(`[정산 변경] ${selectedStreamer.name}의 수익 배분이 ${text}로 변경되었습니다.`, 'event');
                document.getElementById('streamer-modal-drain').innerText = (selectedStreamer.getMentalDrain() * 100).toFixed(1);
            }
        }

        function fireSelectedStreamer() {
            if (selectedStreamer) {
                selectedStreamer.releaseNode();
                let index = world.streamers.indexOf(selectedStreamer);
                if (index > -1) {
                    world.streamers.splice(index, 1);
                    addLog(`[방출] ${selectedStreamer.name} 스트리머와 계약을 해지했습니다.`, 'hr');
                }
                closeStreamerModal(); updateUI();
            }
        }

        function checkBroadcastTime() {
            if(forceOvertime) return true;
            let now = new Date(); let h = now.getHours(); 
            if (h >= 10 || h < 2) return true;
            return false;
        }

        function toggleOvertime() {
            forceOvertime = !forceOvertime;
            const btn = document.getElementById('overtime-btn');
            if(forceOvertime) {
                btn.className = 'top-btn on'; btn.innerText = '🌙 연장 해제';
                addLog('⚠️ 강제 철야 방송 시작! 스트리머 전원 휴식을 중단하고 출근합니다.', 'event');
            } else {
                btn.className = 'top-btn'; btn.innerText = '🌙 연장 방송';
                addLog('✅ 연장 방송 조치가 해제되었습니다.', 'event');
            }
            updateClockAndBanner();
        }

        function receiveSuperchat(streamer) {
            let cat = platforms[streamer.currentCategory];
            let trendMultiplier = 1 + (cat.trend * 10);
            let makeupMultiplier = 1 + (streamer.makeupLevel * 0.15);
            
            let baseAmt = Math.random() * streamer.superchatPower * makeupMultiplier * trendMultiplier;
            let superchat = Math.floor(baseAmt / 1000) * 1000; 
            
            if(superchat < 1000) return; 

            let compShare = superchat * streamer.companySplit;
            company.cash += compShare;
            company.totalProfit += compShare;
            streamer.totalEarnedForCompany += compShare;

            let gainedFollowers = Math.floor((superchat / 20) * (1 + streamer.makeupLevel * 0.1));
            if (gainedFollowers < 10) gainedFollowers = Math.floor(Math.random() * 50) + 10;
            streamer.followers += gainedFollowers;
            streamer.checkPromotion();

            let msgText = DUMMY_MESSAGES[Math.floor(Math.random() * DUMMY_MESSAGES.length)];
            
            streamer.messages.unshift({ amount: superchat, text: msgText });
            if(streamer.messages.length > 20) streamer.messages.pop(); 
            
            let logHtml = `💸 [슈퍼챗] ${streamer.name}(${cat.name}) ${superchat.toLocaleString()}원 (+${gainedFollowers.toLocaleString()}명)<span class="log-msg">"${msgText}"</span>`;
            addLog(logHtml, 'superchat');
            updateUI();
        }

        function simulatePlatformTraffic() {
            for (let category in platforms) {
                let changePercent = (Math.random() - 0.5) * 0.1;
                let newViewers = platforms[category].viewers + (platforms[category].viewers * changePercent);
                if (newViewers > 1000) {
                    platforms[category].viewers = newViewers;
                    platforms[category].trend = changePercent;
                }
            }
            initTicker();
            updateUI();
        }

        function initTicker() {
            let tickerPanel = document.getElementById('ticker-panel');
            tickerPanel.innerHTML = '';
            for (let category in platforms) {
                let div = document.createElement('div'); div.className = 'stock-item';
                let trendClass = platforms[category].trend >= 0 ? 'trend-up' : 'trend-down';
                let trendText = platforms[category].trend >= 0 ? `▲ ${(platforms[category].trend*100).toFixed(1)}%` : `▼ ${(Math.abs(platforms[category].trend)*100).toFixed(1)}%`;
                
                div.innerHTML = `
                    <span class="stock-name">${platforms[category].name}</span>
                    <span class="stock-price">${Math.floor(platforms[category].viewers).toLocaleString()}명</span>
                    <span class="${trendClass}">${trendText}</span>
                `;
                tickerPanel.appendChild(div);
            }
        }

        function updateClockAndBanner() {
            let now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            let s = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('real-time-clock').innerText = `${h}:${m}:${s}`;
            document.getElementById('real-date-text').innerText = `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}`;

            let banner = document.getElementById('market-banner');
            let isBroadcastTime = checkBroadcastTime();
            if (isBroadcastTime) {
                banner.className = 'open';
                banner.innerText = forceOvertime ? '⚠️ 강제 연장 방송 진행 중 (스트리머 멘탈 주의)' : '📈 정규 방송 시간 (소속 스트리머 라이브 진행 중)';
            } else {
                banner.className = '';
                banner.innerText = '💤 정규 방송 시간 종료 (소속 스트리머 휴식 중)';
            }
            return isBroadcastTime;
        }

        function updateUI() {
            document.getElementById('cash-display').innerText = `${Math.floor(company.cash).toLocaleString()}원`;
            let roiEl = document.getElementById('roi-display');
            roiEl.innerText = `누적 소속사 수익: ${company.totalProfit > 0 ? '+' : ''}${Math.floor(company.totalProfit).toLocaleString()}원`;
            roiEl.className = `roi ${company.totalProfit >= 0 ? 'up' : 'down'}`;

            let inactiveDeskCount = world.desks.filter(d => !d.active).length;
            let expandBtn = document.getElementById('expand-btn-text');
            if(inactiveDeskCount === 0) {
                expandBtn.innerText = "🏢 확장 완료 (최대)";
                expandBtn.style.opacity = "0.4";
            } else {
                expandBtn.innerText = "🏢 좌석 확장 (500만)";
                expandBtn.style.opacity = "1";
            }
        }

        function addLog(message, type = '') {
            let logItem = document.createElement('div'); logItem.className = `log-item ${type}`;
            let now = new Date();
            let timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            logItem.innerHTML = `<span class="log-time">${timeStr}</span><span class="log-content">${message}</span>`;
            logPanel.prepend(logItem);
            if (logPanel.children.length > 50) logPanel.removeChild(logPanel.lastChild);
        }

        function saveGameData() {
            const savedStreamers = world.streamers.map(s => ({
                id: s.id, name: s.name, tierType: s.tierType, roleName: s.roleName,
                color: s.color, speed: s.speed, streamCooldown: s.baseCooldown,
                baseDrain: s.baseDrain, superchatPower: s.superchatPower, photo: s.photo,
                followers: s.followers, totalEarnedForCompany: s.totalEarnedForCompany,
                companySplit: s.companySplit, currentCategory: s.currentCategory,
                makeupLevel: s.makeupLevel, pcLevel: s.pcLevel, speechLevel: s.speechLevel,
                messages: s.messages
            }));

            const saveData = {
                company: company,
                deskStatus: world.desks.map(d => d.active),
                restStatus: world.restAreas.map(r => r.active),
                streamers: savedStreamers,
                idCounter: world.idCounter
            };

            localStorage.setItem('MCN_OFFICE_SAVE', JSON.stringify(saveData));
            console.log("자동 저장 완료:", new Date().toLocaleTimeString());
        }

        function loadGameData() {
            const raw = localStorage.getItem('MCN_OFFICE_SAVE');
            if (!raw) return false;

            try {
                const data = JSON.parse(raw);
                company = data.company;
                world.idCounter = data.idCounter || 1;

                if (data.deskStatus) {
                    data.deskStatus.forEach((active, idx) => { if(world.desks[idx]) world.desks[idx].active = active; });
                }
                if (data.restStatus) {
                    data.restStatus.forEach((active, idx) => { if(world.restAreas[idx]) world.restAreas[idx].active = active; });
                }

                world.streamers = [];
                if (data.streamers) {
                    data.streamers.forEach(sData => {
                        let restored = new Streamer(sData.id, sData);
                        restored.totalEarnedForCompany = sData.totalEarnedForCompany || 0;
                        restored.companySplit = sData.companySplit !== undefined ? sData.companySplit : 0.5;
                        restored.currentCategory = sData.currentCategory || 'JustChatting';
                        restored.makeupLevel = sData.makeupLevel || 0;
                        restored.pcLevel = sData.pcLevel || 0;
                        restored.speechLevel = sData.speechLevel || 0;
                        restored.messages = sData.messages || [];
                        world.streamers.push(restored);
                    });
                }
                return true;
            } catch (e) {
                console.error("데이터 복구 실패:", e);
                return false;
            }
        }

        let lastSimTime = 0;
        let lastSaveTime = Date.now();

        /* 🎨 인게임 캔버스 그래픽 요소 전면 리스타일링 */
        function gameLoop() {
            if (!isPaused) {
                let isBroadcastTime = updateClockAndBanner();
                let nowTs = Date.now();
                
                if (nowTs - lastSimTime > 15000) {
                    lastSimTime = nowTs;
                    simulatePlatformTraffic(); 
                }

                if (nowTs - lastSaveTime > 5000) {
                    saveGameData();
                    lastSaveTime = nowTs;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 메인 오피스 배경 스타일링 (방송 시간 여부에 따라 유기적 전환)
                if(!isBroadcastTime) {
                    ctx.fillStyle = '#0a0b0d'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#131518'; ctx.fillRect(16, 16, 308, 184); // 데스크 존
                    ctx.fillStyle = '#131518'; ctx.fillRect(16, 216, 308, 108); // 휴게실 존
                } else {
                    ctx.fillStyle = '#0c0d0f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#181a1e'; ctx.fillRect(16, 16, 308, 184);
                    ctx.fillStyle = '#181a1e'; ctx.fillRect(16, 216, 308, 108);
                }
                
                // 구역 텍스트 라벨링
                ctx.fillStyle = '#262930'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('STUDIO AREA', 28, 40); ctx.fillText('LOUNGE AREA', 28, 238);

                // 방송 책상 및 모니터 장비 그래픽 처리
                world.desks.forEach(desk => {
                    if(!desk.active) {
                        ctx.fillStyle = '#0a0b0d'; ctx.fillRect(desk.x - 20, desk.y - 12, 40, 18);
                        ctx.fillStyle = '#262930'; ctx.font = '12px sans-serif'; ctx.fillText('🔒', desk.x - 6, desk.y + 4);
                        return;
                    }
                    // 책상 본체
                    ctx.fillStyle = '#25282e'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(desk.x - 20, desk.y - 12, 40, 18, 3) : ctx.fillRect(desk.x - 20, desk.y - 12, 40, 18); ctx.fill();
                    // 모니터 본체
                    ctx.fillStyle = '#050507'; ctx.fillRect(desk.x - 14, desk.y - 16, 28, 12);
                    
                    if(desk.occupant && isBroadcastTime) {
                        // 방송 송출 중 모니터 불빛 장식 (네온 그린 하이라이팅)
                        ctx.fillStyle = 'rgba(0, 255, 163, 0.25)'; ctx.fillRect(desk.x - 12, desk.y - 14, 24, 8); 
                        ctx.fillStyle = 'var(--point-green)'; ctx.beginPath(); ctx.arc(desk.x + 16, desk.y - 18, 3, 0, Math.PI*2); ctx.fill(); 
                    } else {
                        ctx.fillStyle = '#131518'; ctx.fillRect(desk.x - 12, desk.y - 14, 24, 8);
                    }
                });

                // 휴게존 소파 안락의자 그래픽 처리
                world.restAreas.forEach(cm => {
                    if(!cm.active) return;
                    ctx.fillStyle = '#25282e'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cm.x - 15, cm.y - 10, 30, 20, 5) : ctx.fillRect(cm.x - 15, cm.y - 10, 30, 20); ctx.fill();
                    ctx.fillStyle = '#181a1e'; ctx.fillRect(cm.x - 10, cm.y - 5, 20, 11);
                });

                world.streamers.forEach(streamer => {
                    streamer.update(isBroadcastTime);
                    streamer.draw();
                });
            }
            requestAnimationFrame(gameLoop);
        }

        initCategoryOptions();
        initTicker();
        
        const hasSavedData = loadGameData();

        if (!hasSavedData) {
            let initData = STREAMER_POOL.find(s => s.tierType === 'Rookie') || STREAMER_POOL[0];
            let initBase = TIERS[initData.tierType];
            let initConfig = {
                tierType: initData.tierType, roleName: initBase.roleName, color: initBase.color, speed: initBase.speed,
                streamCooldown: initBase.streamCooldown, baseDrain: initBase.baseDrain, superchatPower: initBase.superchatPower,
                name: initData.name, photo: initData.photo, hireFee: 0
            };
            world.streamers.push(new Streamer(world.idCounter++, initConfig));
            const startNow = new Date();
            addLog(`MCN 소속사 운영을 시작합니다. (${startNow.getFullYear()}년 ${startNow.getMonth() + 1}월 ${startNow.getDate()}일)`, 'event');
        } else {
            addLog(`💾 이전 MCN 경영 기록을 로컬스토리지에서 성공적으로 불러왔습니다.`, 'event');
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
